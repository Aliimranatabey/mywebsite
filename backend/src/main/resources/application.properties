spring.application.name=personalwebsite
# ----- PostgreSQL -----
spring.datasource.url=jdbc:postgresql://localhost:5432/personal_site
spring.datasource.username=devuser
spring.datasource.password=devpass

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----- Flyway -----
spring.flyway.enabled=true

# ----- Mail Configuration (Gmail) -----
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# Kimlik bilgileri koddan degil ortam degiskenlerinden gelir (kok dizindeki .env)
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ----- Server Limits -----
server.tomcat.max-http-post-size=50MB
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB


# ----- Iletisim Formu -----
# Formdan gelen mesajlarin dusecegi adres
app.contact.recipient=${CONTACT_RECIPIENT:aliimranatabey@gmail.com}

# ----- Yuklenen gorseller -----
# Docker'da /app/uploads volume'u kullanilir (docker-compose.yml)
app.uploads.dir=${UPLOADS_DIR:./uploads}
