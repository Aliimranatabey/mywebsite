spring.application.name=personalwebsite
# ----- PostgreSQL -----
spring.datasource.url=jdbc:postgresql://localhost:5432/personal_site
spring.datasource.username=devuser
spring.datasource.password=devpass

# ----- JPA / Hibernate -----
spring.jpa.hibernate.ddl-auto=validate
# Sorguları loga basmak sadece geliştirirken (SPRING_JPA_SHOW_SQL=true)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----- Flyway -----
spring.flyway.enabled=true

# İletişim formu yok: site ziyaretçiden hiçbir kişisel veri almaz ve saklamaz (KVKK).
# Ziyaretçiler İletişim sayfasındaki e-posta adresine kendi posta programlarından yazar.

# ----- Server Limits -----
# Görsel en fazla 5 MB (ImageStorageService), yazı içeriği en fazla ~2 MB
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

# ----- Proxy arkası -----
# Gerçek ziyaretçi IP'si ve https bilgisi X-Forwarded-* zincirinden, sadece iç ağdaki
# proxy'lere (nginx, Caddy) güvenerek okunur. Hız sınırı bu IP'yi kullanır.
server.forward-headers-strategy=native

# ----- Oturum çerezi -----
# Secure bayrağı HTTPS kurulunca SERVER_SERVLET_SESSION_COOKIE_SECURE=true ile açılır
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ----- Üyelik -----
# Canlıda docker-compose.yml bunu kapatır (REGISTRATION_ENABLED)
app.registration.enabled=${REGISTRATION_ENABLED:true}


# ----- Yuklenen gorseller -----
# Docker'da /app/uploads volume'u kullanilir (docker-compose.yml)
app.uploads.dir=${UPLOADS_DIR:./uploads}
