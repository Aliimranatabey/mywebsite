# Testler bellek içi H2 kullanır: çalışan bir PostgreSQL gerekmez.
# (Eskiden bu test localhost:5432'ye bağlanmaya çalışıp hata veriyordu.)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Flyway migration'ları PostgreSQL'e özgü; testlerde şemayı Hibernate kurar
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Testlerde gerçek mail sunucusuna bağlanmaya çalışmasın
spring.mail.host=localhost
spring.mail.port=3025
MAIL_USERNAME=
MAIL_PASSWORD=

# Bu dosya ana application.properties'in yerine geçer,
# o yüzden uygulamanın beklediği ayarlar burada da tanımlı olmalı
app.contact.recipient=test@ornek.com
app.cors.allowed-origins=http://localhost:5173
app.uploads.dir=target/test-uploads
