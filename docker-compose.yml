services:
  postgres:
    image: postgres:16
    container_name: personal_website_db
    environment:
      POSTGRES_DB: personal_site
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass
    ports:
      - "5433:5432"
    volumes:
      - personal_website_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: personal_website_pgadmin
    depends_on:
      - postgres
    ports:
      - "5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - personal_website_pgadmin_data:/var/lib/pgadmin

  backend:
    build: ./backend
    container_name: personal_website_backend
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/personal_site
      SPRING_DATASOURCE_USERNAME: devuser
      SPRING_DATASOURCE_PASSWORD: devpass
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      # Kok dizindeki .env dosyasindan okunur (git'e girmez)
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      CONTACT_RECIPIENT: ${CONTACT_RECIPIENT:-aliimranatabey@gmail.com}
      UPLOADS_DIR: /app/uploads
    volumes:
      # Kapak gorselleri: container silinse de kalir
      - personal_website_uploads:/app/uploads
    ports:
      - "8091:8080"

  frontend:
    build: ./frontend
    container_name: personal_website_frontend
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  personal_website_data:
  personal_website_pgadmin_data:
  personal_website_uploads:
