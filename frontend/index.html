<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ali İmran Atabey</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Ali İmran Atabey — yazılım, teknoloji ve hayat üzerine yazılar."
    />

    <!-- Bağlantı WhatsApp/LinkedIn/X'te paylaşılınca görünen önizleme.
         __SITE_URL__ yerine nginx o anki adresi yazar (nginx.conf → sub_filter). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:site_name" content="Ali İmran Atabey" />
    <meta property="og:title" content="Ali İmran Atabey" />
    <meta
      property="og:description"
      content="Yazılım, teknoloji ve hayat üzerine yazılar."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/apple-touch-icon.png" />
    <meta name="twitter:card" content="summary" />

    <script src="/theme-init.js"></script>

    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #f5f5f7;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body,
      html[data-theme='dark'] #app {
        background-color: #000000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
