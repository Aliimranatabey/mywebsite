<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ali İmran Atabey</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta
      name="description"
      content="Ali İmran Atabey — yazılım, teknoloji ve hayat üzerine yazılar."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Tema sayfa boyanmadan önce belirlensin, açık/koyu arasında parlama olmasın.
      // Önce kullanıcının seçimi, yoksa işletim sisteminin ayarı.
      ;(function () {
        var theme = 'light'
        try {
          var saved = localStorage.getItem('theme')
          if (saved === 'light' || saved === 'dark') theme = saved
          else if (window.matchMedia('(prefers-color-scheme: dark)').matches) theme = 'dark'
        } catch (e) {
          if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark'
          }
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <style>
      html,
      body,
      #app {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        background-color: #f5f5f7;
      }
      html[data-theme='dark'],
      html[data-theme='dark'] body,
      html[data-theme='dark'] #app {
        background-color: #000000;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
