# Caddy (HTTPS) önündeyken onun yazdığı X-Forwarded-Proto'yu koru;
# yoksa kendi bağlantımızın şemasını yaz. Backend https olduğunu buradan anlar.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# HSTS sadece https üzerinden gelen isteklerde gönderilir (http'de anlamsız)
map $forwarded_proto $hsts {
    https   "max-age=31536000; includeSubDomains";
    default "";
}

server {
    listen 80;
    server_name localhost;

    # Hata sayfalarında ve header'da nginx sürümünü gösterme
    server_tokens off;

    # Kapak görseli en fazla 5 MB, yazı içeriği en fazla ~2 MB (backend de kontrol ediyor)
    client_max_body_size 6m;

    # Arama motorlarına: yazıları tara, giriş/kayıt/editör sayfalarını tarama
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /login\nDisallow: /register\nDisallow: /blog/new\n\nSitemap: $forwarded_proto://$http_host/sitemap.xml\n";
    }

    # Site haritası backend'de üretilir (yazı listesi veritabanında)
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/sitemap.xml;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;

        # index.html'deki paylaşım önizlemesi (og:url, og:image) tam adres ister;
        # alan adını koda gömmemek için o anki adresi buradan yazıyoruz
        sub_filter '__SITE_URL__' '$forwarded_proto://$http_host';
        sub_filter_once off;

        # Dosya adında hash olan JS/CSS/görseller değişmez: tarayıcı bir yıl saklasın.
        # (add_header değil expires: iç blokta add_header yazılırsa aşağıdaki
        # güvenlik başlıkları bu dosyalara gitmez.)
        location /assets/ {
            expires 1y;
        }

        # Tarayıcı güvenlik başlıkları. /api yanıtlarına bunları Spring Security ekliyor.
        #  - CSP: script ve font sadece kendi sunucumuzdan; yazılardaki görseller dış adreslerden
        #    gelebiliyor (Medium vb.), o yüzden img-src https: açık. Vuetify satır içi
        #    style ürettiği için style-src 'unsafe-inline' gerekli.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security $hsts always;
    }

    location /api {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
